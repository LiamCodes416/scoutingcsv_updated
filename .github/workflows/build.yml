name: Compile Python App to EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka zstandard customtkinter requests qrcode pillow

    - name: Compile Executable with Nuitka
      run: |
        python -m pip install ziglang
        python -m nuitka --standalone --onefile --plugin-enable=tk-inter --include-data-dir=src=src --windows-console-mode=disable --windows-icon-from-ico=src/icon.ico --assume-yes-for-downloads main.py

    - name: Upload Compiled EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScoutingAppHub-Windows
        path: main.exe
        if-no-files-found: error
